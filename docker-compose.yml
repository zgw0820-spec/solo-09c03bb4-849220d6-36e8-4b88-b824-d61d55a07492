services:
  collector:
    build: .
    image: otlp-tail-sampler:local
    container_name: otlp-tail-sampler
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/collector.db
      COLLECT_WINDOW_SECONDS: "5"
      # 演示取值（大于代码默认的 8）：让网页一次批量模拟的链都能被接纳，
      # 从而在同一时刻成批到期、形成清理积压。
      MAX_ACTIVE_TRACES: "400"
      SLOW_ROOT_MS: "500"
      SWEEP_INTERVAL_MS: "50"
      # 后台清理：每批一个事务、最多删 200 条；间隔放慢到 1s，
      # 方便在网页上看到「待清理」从高位逐步降到阈值以下、接纳随之恢复。
      CLEANUP_BATCH_SIZE: "200"
      CLEANUP_INTERVAL_MS: "1000"
      MAX_PENDING_DELETE_SPANS: "1000"
    volumes:
      # Named volume keeps collection state (and deadlines) across restarts.
      - collector-data:/data
    restart: unless-stopped

volumes:
  collector-data:
